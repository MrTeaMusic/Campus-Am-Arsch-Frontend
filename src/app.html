<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png?v=%icon-ver%"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png?v=%icon-ver%"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png?v=%icon-ver%"
		/>
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#905bd5" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico?v=%icon-ver%" />
		<meta name="msapplication-TileColor" content="#2d89ef" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="description" content="CampusDual 2027 Vision" />
		<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)" />
		<title>Campus-Am-Arsch</title>
		<script>
			// eigene Farbe und Hell/Dunkel vor dem ersten Bild setzen, sonst blitzt kurz das Standard-Design auf
			try {
				const a = JSON.parse(localStorage.getItem('appearance') || '{}');
				if (a.accent && a.accent !== 'blau') document.documentElement.dataset.accent = a.accent;
				if (a.mode === 'hell') document.documentElement.dataset.theme = 'campus';
				if (a.mode === 'dunkel') document.documentElement.dataset.theme = 'campus-dark';
			} catch {
				// no stored choice
			}
		</script>
		%sveltekit.head%
	</head>

	<body
		class="touch-manipulation select-none"
		style="-webkit-tap-highlight-color: transparent"
		data-sveltekit-preload-data="hover"
	>
		<div class="ec-auto-dark" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
